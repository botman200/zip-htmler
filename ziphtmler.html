<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instant Arcade Matrix</title>
    <style>
        :root {
            --bg: #0b0b0e;
            --panel: #141419;
            --accent: #10b981;
            --accent-hover: #059669;
            --text: #f4f4f5;
            --muted: #71717a;
            --border: #27272a;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        /* Left Hand Side Menu Control panel */
        .sidebar {
            width: 320px;
            background-color: var(--panel);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 1.5rem;
            box-sizing: border-box;
        }
        h2 { margin: 0 0 1rem 0; font-size: 1.3rem; display: flex; align-items: center; gap: 0.5rem; }
        
        .upload-btn {
            background: #27272a;
            border: 1px dashed var(--muted);
            padding: 0.75rem;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            display: block;
            margin-bottom: 1rem;
        }
        .upload-btn:hover { border-color: var(--accent); color: var(--accent); }
        input[type="file"] { display: none; }
        
        .search-box {
            background: var(--bg);
            border: 1px solid var(--border);
            color: #fff;
            padding: 0.6rem 0.75rem;
            border-radius: 6px;
            margin-bottom: 1rem;
            outline: none;
            font-size: 0.9rem;
        }
        .search-box:focus { border-color: var(--accent); }

        .game-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }
        .game-item {
            background: transparent;
            color: var(--text);
            border: 1px solid transparent;
            padding: 0.6rem 0.8rem;
            text-align: left;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-transform: capitalize;
        }
        .game-item:hover { background: #27272a; }
        .game-item.active { background: var(--accent); color: #000; font-weight: 600; }

        /* Right Hand Side Interactive Simulation Screen */
        .stage {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg);
            position: relative;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #fff;
        }
        .welcome-banner {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            text-align: center; color: var(--muted);
            pointer-events: none;
            width: 80%;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>library of html</h2>
        <label class="upload-btn">
            📂 Load HTML Files
            <input type="file" id="matrixPicker" accept=".html" multiple>
        </label>
        <input type="text" id="matrixSearch" class="search-box" placeholder="Search loaded matrix..." disabled>
        <div id="statusIndicator" style="display:none; color:var(--accent); font-size:0.85rem; margin-bottom:1rem;">Reading game stream...</div>
        <div class="game-list" id="matrixContainer"></div>
    </div>

    <div class="stage">
        <div class="welcome-banner" id="welcomeBanner">
            <h3>No Games Active In Matrix</h3>
            <p>Click <strong>"Load HTML Files"</strong>, press <strong>Ctrl + A</strong> to grab your unzipped folder assets, and populate your canvas immediately.</p>
        </div>
        <iframe id="matrixFrame" style="display: none;" sandbox="allow-scripts allow-same-origin"></iframe>
    </div>

    <script>
        let loadedMatrixData = {}; 
        const matrixPicker = document.getElementById('matrixPicker');
        const matrixSearch = document.getElementById('matrixSearch');
        const matrixContainer = document.getElementById('matrixContainer');
        const statusIndicator = document.getElementById('statusIndicator');
        const matrixFrame = document.getElementById('matrixFrame');
        const welcomeBanner = document.getElementById('welcomeBanner');

        function readFile(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = (e) => resolve({ name: file.name, content: e.target.result, success: true });
                reader.onerror = () => resolve({ success: false });
                reader.readAsText(file);
            });
        }

        matrixPicker.addEventListener('change', async function(e) {
            const files = Array.from(e.target.files);
            if (files.length === 0) return;

            statusIndicator.style.display = 'block';
            matrixContainer.innerHTML = '';
            loadedMatrixData = {};

            const htmlFiles = files.filter(f => f.name.toLowerCase().endsWith('.html'));
            const batchSize = 25;

            for (let i = 0; i < htmlFiles.length; i += batchSize) {
                const chunk = htmlFiles.slice(i, i + batchSize);
                const parsedResults = await Promise.all(chunk.map(file => readFile(file)));
                
                parsedResults.forEach(res => {
                    if (res.success) {
                        let cleanTitle = res.name.replace('.html', '').replace(/-/g, ' ');
                        loadedMatrixData[cleanTitle] = res.content;
                    }
                });
                
                statusIndicator.textContent = `Mapping matrix: ${Math.min(i + batchSize, htmlFiles.length)} of ${htmlFiles.length}...`;
                await new Promise(r => setTimeout(r, 30));
            }

            statusIndicator.style.display = 'none';
            matrixSearch.disabled = false;
            renderMatrixGrid();
        });

        function renderMatrixGrid(query = '') {
            matrixContainer.innerHTML = '';
            const sortedTitles = Object.keys(loadedMatrixData).sort();
            
            let matchCounter = 0;
            sortedTitles.forEach(title => {
                if (title.toLowerCase().includes(query.toLowerCase())) {
                    matchCounter++;
                    const rowButton = document.createElement('button');
                    rowButton.className = 'game-item';
                    rowButton.textContent = title;
                    rowButton.onclick = () => deployMatrixGame(title, rowButton);
                    matrixContainer.appendChild(rowButton);
                }
            });

            if (matchCounter === 0 && Object.keys(loadedMatrixData).length > 0) {
                matrixContainer.innerHTML = '<div style="color:var(--muted); font-size:0.85rem; text-align:center; padding-top:1rem;">No results in matrix</div>';
            }
        }

        matrixSearch.addEventListener('input', (e) => renderMatrixGrid(e.target.value));

        function deployMatrixGame(title, clickedButton) {
            document.querySelectorAll('.game-item').forEach(el => el.classList.remove('active'));
            clickedButton.classList.add('active');

            welcomeBanner.style.display = 'none';
            matrixFrame.style.display = 'block';

            const rawContent = loadedMatrixData[title];
            const dataBlob = new Blob([rawContent], { type: 'text/html' });
            
            matrixFrame.src = URL.createObjectURL(dataBlob);
        }
    </script>
</body>
</html>
